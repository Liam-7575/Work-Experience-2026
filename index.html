<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Todo App</title>
  </head>
  <body>
    <section class="todo" id="todoBox">
      
      <div class="header-bar" id="dragHandle" title="Drag to move">
        <h2>To-do list</h2>
        <button id="settingsBtn" class="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <div id="settingsMenu" class="settings-menu hidden">
        <div class="setting-item">
          <span>Dark Mode</span>
          <label class="switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider round"></span>
          </label>
        </div>
        <div class="setting-item">
          <span>Sort By</span>
          <select id="sortSelect" class="sort-select">
            <option value="date">Creation Date</option>
            <option value="highToLow">Priority (High to Low)</option>
            <option value="lowToHigh">Priority (Low to High)</option>
          </select>
        </div>
      </div>

      <div class="input">
        <input
          type="text"
          class="input-field"
          id="todoInput"
          placeholder="Add or search tasks..."
        />
        <button class="btn">Add</button>
      </div>
      
      <div class="priority-row">
        <label for="prioritySlider">Priority:</label>
        <input type="range" id="prioritySlider" class="priority-slider" min="1" max="3" value="1" step="1">
        <span id="priorityLabel" class="priority-label prio-1-text">Low</span>
      </div>
      
      <ul class="scroll" id="todoList"></ul>

      <div>
        <hr class="counter" />
        <div class="counter-container">
          <p><span id="todoCount">0</span> tasks total</p>
          <button id="deleteButton">Delete All</button>
        </div>
      </div>

      <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-content">
          <h3 class="modal-title">Clear all tasks?</h3>
          <p class="modal-desc">This action cannot be undone.</p>
          <div class="modal-actions">
            <button id="cancelDeleteBtn" class="modal-btn cancel-btn">Cancel</button>
            <button id="confirmDeleteBtn" class="modal-btn danger-btn">Delete All</button>
          </div>
        </div>
      </div>
      
    </section>
  </body>
</html>
